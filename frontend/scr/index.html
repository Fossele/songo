<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songo</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="game-container">

        <div class="scoreboard">
            <div class="score">
                <h2>Joueur 2</h2>
                <span id="score2">0</span>
            </div>

            <div class="turn">
                Tour : <span id="current-player">Joueur 1</span>
            </div>

            <div class="score">
                <h2>Joueur 1</h2>
                <span id="score1">0</span>
            </div>
        </div>

        <div class="board">

            <!-- Rangée adverse -->
            <div class="pit" data-index="13">5</div>
            <div class="pit" data-index="12">5</div>
            <div class="pit" data-index="11">5</div>
            <div class="pit" data-index="10">5</div>
            <div class="pit" data-index="9">5</div>
            <div class="pit" data-index="8">5</div>
            <div class="pit" data-index="7">5</div>

            <!-- Ta rangée -->
            <div class="pit" data-index="0">5</div>
            <div class="pit" data-index="1">5</div>
            <div class="pit" data-index="2">5</div>
            <div class="pit" data-index="3">5</div>
            <div class="pit" data-index="4">5</div>
            <div class="pit" data-index="5">5</div>
            <div class="pit" data-index="6">5</div>

        </div>

    </div>

</body>
<script src="regle.js"></script>
</html>
